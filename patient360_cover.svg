<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 750" width="1500" height="750">
  <defs>
    <!-- Background gradient: deep navy to slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a1628"/>
      <stop offset="60%"  stop-color="#0d2244"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>

    <!-- Snowflake blue accent -->
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#29b5e8"/>
      <stop offset="100%" stop-color="#1a8fc1"/>
    </linearGradient>

    <!-- Teal accent for AI elements -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00a88a"/>
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft shadow for cards -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1500" height="750" fill="url(#bgGrad)"/>
  <rect width="1500" height="750" fill="url(#grid)"/>

  <!-- Subtle radial glow center-left -->
  <ellipse cx="420" cy="375" rx="460" ry="360" fill="#29b5e8" fill-opacity="0.05"/>
  <!-- Subtle glow right side -->
  <ellipse cx="1200" cy="300" rx="380" ry="280" fill="#00d4aa" fill-opacity="0.04"/>

  <!-- ─────────────────────────────────────────── -->
  <!-- LEFT PANEL: Text content                    -->
  <!-- ─────────────────────────────────────────── -->

  <!-- Eyebrow tag -->
  <rect x="80" y="140" width="220" height="32" rx="16" fill="#29b5e8" fill-opacity="0.18"/>
  <text x="190" y="161" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600"
        fill="#29b5e8" text-anchor="middle" letter-spacing="2">MEDIUM · BLOG POST</text>

  <!-- Main title: Patient -->
  <text x="80" y="248" font-family="'Segoe UI', Arial, sans-serif" font-size="88" font-weight="800"
        fill="#ffffff" letter-spacing="-2">Patient</text>

  <!-- Main title: 360 in Snowflake blue -->
  <text x="80" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="88" font-weight="800"
        fill="url(#snowGrad)" letter-spacing="-2" filter="url(#glow)">360</text>

  <!-- Divider line -->
  <rect x="80" y="365" width="420" height="3" rx="2" fill="url(#aiGrad)"/>

  <!-- Subtitle line 1 -->
  <text x="80" y="408" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400"
        fill="#a8c4d8" letter-spacing="0.3">AI-Powered Unified Patient View</text>

  <!-- Subtitle line 2 -->
  <text x="80" y="438" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="400"
        fill="#a8c4d8" letter-spacing="0.3">on Snowflake Cortex &amp; Salesforce</text>

  <!-- Tech badges row -->
  <!-- Snowflake badge -->
  <rect x="80" y="490" width="148" height="38" rx="8" fill="#29b5e8" fill-opacity="0.15" stroke="#29b5e8" stroke-width="1" stroke-opacity="0.4"/>
  <text x="154" y="514" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600"
        fill="#29b5e8" text-anchor="middle">❄ Snowflake</text>

  <!-- Cortex AI badge -->
  <rect x="244" y="490" width="140" height="38" rx="8" fill="#00d4aa" fill-opacity="0.12" stroke="#00d4aa" stroke-width="1" stroke-opacity="0.4"/>
  <text x="314" y="514" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600"
        fill="#00d4aa" text-anchor="middle">⚡ Cortex AI</text>

  <!-- Salesforce badge -->
  <rect x="400" y="490" width="140" height="38" rx="8" fill="#4bcffa" fill-opacity="0.12" stroke="#4bcffa" stroke-width="1" stroke-opacity="0.4"/>
  <text x="470" y="514" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600"
        fill="#4bcffa" text-anchor="middle">☁ Salesforce</text>

  <!-- React + FastAPI badge -->
  <rect x="80" y="542" width="140" height="38" rx="8" fill="#61dafb" fill-opacity="0.1" stroke="#61dafb" stroke-width="1" stroke-opacity="0.35"/>
  <text x="150" y="566" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600"
        fill="#61dafb" text-anchor="middle">⚛ React</text>

  <!-- FastAPI badge -->
  <rect x="236" y="542" width="148" height="38" rx="8" fill="#05998a" fill-opacity="0.15" stroke="#05998a" stroke-width="1" stroke-opacity="0.4"/>
  <text x="310" y="566" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600"
        fill="#00d4aa" text-anchor="middle">🐍 FastAPI</text>

  <!-- Author / byline -->
  <text x="80" y="648" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400"
        fill="#6a8fa8" letter-spacing="0.5">Srikanth Adilapuram · Inogen · 2026</text>

  <!-- ─────────────────────────────────────────── -->
  <!-- RIGHT PANEL: Dashboard mock-up             -->
  <!-- ─────────────────────────────────────────── -->

  <!-- Outer frame / browser chrome -->
  <rect x="740" y="90" width="700" height="570" rx="16" fill="url(#cardGrad)"
        stroke="#ffffff" stroke-width="1" stroke-opacity="0.12" filter="url(#cardShadow)"/>

  <!-- Browser bar -->
  <rect x="740" y="90" width="700" height="44" rx="16" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="740" y="118" width="700" height="16" fill="#ffffff" fill-opacity="0.05"/>
  <!-- Traffic lights -->
  <circle cx="772" cy="112" r="6" fill="#ff5f57"/>
  <circle cx="796" cy="112" r="6" fill="#febc2e"/>
  <circle cx="820" cy="112" r="6" fill="#28c840"/>
  <!-- Address bar -->
  <rect x="860" y="101" width="430" height="22" rx="11" fill="#ffffff" fill-opacity="0.07"/>
  <text x="1075" y="116" font-family="'Segoe UI', Arial, sans-serif" font-size="11"
        fill="#8ab0c8" text-anchor="middle">patient360.snowflakecomputing.app</text>

  <!-- Header bar inside dashboard -->
  <rect x="740" y="134" width="700" height="52" fill="#0d2244" fill-opacity="0.9"/>
  <text x="772" y="167" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700"
        fill="#29b5e8">Patient360</text>
  <text x="886" y="167" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#a8c4d8">
    Unified Patient Intelligence
  </text>

  <!-- Search bar mock -->
  <rect x="1060" y="146" width="340" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#29b5e8" stroke-width="1" stroke-opacity="0.3"/>
  <text x="1080" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#6a8fa8">
    Search patient or ask a question...
  </text>

  <!-- ── Patient header card ── -->
  <rect x="756" y="202" width="668" height="72" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1"/>
  <!-- Avatar circle -->
  <circle cx="798" cy="238" r="24" fill="#29b5e8" fill-opacity="0.25"/>
  <text x="798" y="244" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700"
        fill="#29b5e8" text-anchor="middle">JD</text>
  <!-- Name -->
  <text x="836" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">John Doe</text>
  <text x="836" y="248" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8ab0c8">DOB: March 15, 1952 · ID: 0012A00000XYZ123</text>
  <text x="836" y="264" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8ab0c8">Los Angeles, CA 90001</text>
  <!-- Status badge -->
  <rect x="1276" y="222" width="110" height="28" rx="14" fill="#00d4aa" fill-opacity="0.2" stroke="#00d4aa" stroke-width="1"/>
  <text x="1331" y="240" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600"
        fill="#00d4aa" text-anchor="middle">● SERVICEABLE</text>

  <!-- ── Four info cards (2×2 grid) ── -->
  <!-- Card 1: Demographics -->
  <rect x="756" y="290" width="318" height="130" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1"/>
  <text x="776" y="316" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#29b5e8">DEMOGRAPHICS</text>
  <text x="776" y="338" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8ab0c8">Gender</text>
  <text x="1006" y="338" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#e2eaf0" text-anchor="end">Male</text>
  <text x="776" y="358" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8ab0c8">Phone</text>
  <text x="1006" y="358" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#e2eaf0" text-anchor="end">(310) 555-0142</text>
  <text x="776" y="378" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8ab0c8">Email</text>
  <text x="1006" y="378" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#e2eaf0" text-anchor="end">jdoe@email.com</text>
  <text x="776" y="398" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8ab0c8">Account Status</text>
  <rect x="900" y="383" width="108" height="20" rx="10" fill="#00d4aa" fill-opacity="0.15"/>
  <text x="1006" y="398" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#00d4aa" text-anchor="end">Active</text>

  <!-- Card 2: Insurance -->
  <rect x="1092" y="290" width="332" height="130" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1"/>
  <text x="1112" y="316" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#29b5e8">INSURANCE</text>
  <text x="1112" y="338" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8ab0c8">Primary</text>
  <text x="1404" y="338" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#e2eaf0" text-anchor="end">Medicare Part B</text>
  <text x="1112" y="358" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8ab0c8">Secondary</text>
  <text x="1404" y="358" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#e2eaf0" text-anchor="end">Blue Shield CA</text>
  <text x="1112" y="378" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8ab0c8">Medicare ID</text>
  <text x="1404" y="378" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#e2eaf0" text-anchor="end">1EG4-TE5-MK72</text>
  <text x="1112" y="398" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8ab0c8">Auth Status</text>
  <text x="1404" y="398" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#00d4aa" text-anchor="end">Approved</text>

  <!-- Card 3: Medical Info -->
  <rect x="756" y="436" width="318" height="130" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1"/>
  <text x="776" y="462" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#29b5e8">MEDICAL DETAILS</text>
  <text x="776" y="484" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8ab0c8">Diagnosis</text>
  <text x="1006" y="484" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#e2eaf0" text-anchor="end">COPD (J44.1)</text>
  <text x="776" y="504" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8ab0c8">LPM Setting</text>
  <text x="1006" y="504" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#e2eaf0" text-anchor="end">2 LPM Continuous</text>
  <text x="776" y="524" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8ab0c8">Equipment</text>
  <text x="1006" y="524" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#e2eaf0" text-anchor="end">Portable Concentrator</text>
  <text x="776" y="544" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8ab0c8">Physician</text>
  <text x="1006" y="544" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#e2eaf0" text-anchor="end">Dr. Sarah Chen</text>

  <!-- Card 4: AI Chat -->
  <rect x="1092" y="436" width="332" height="130" rx="10" fill="#00d4aa" fill-opacity="0.06" stroke="#00d4aa" stroke-width="1" stroke-opacity="0.2"/>
  <text x="1112" y="462" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#00d4aa">AI ASSISTANT  ⚡ CORTEX</text>

  <!-- User bubble -->
  <rect x="1112" y="472" width="290" height="28" rx="8" fill="#ffffff" fill-opacity="0.07"/>
  <text x="1122" y="490" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#a8c4d8">
    What is this patient's LPM and diagnosis?
  </text>

  <!-- AI response bubble -->
  <rect x="1112" y="508" width="290" height="44" rx="8" fill="#00d4aa" fill-opacity="0.12"/>
  <text x="1122" y="524" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#e2eaf0">
    Patient has COPD (J44.1), prescribed
  </text>
  <text x="1122" y="540" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#e2eaf0">
    2 LPM continuous oxygen therapy.
  </text>
  <!-- AI label -->
  <text x="1122" y="558" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#00d4aa">
    ✓ Generated via Cortex Analyst · Query ID: a3f2b8c
  </text>

  <!-- ── Bottom status bar ── -->
  <rect x="740" y="608" width="700" height="52" rx="10" fill="#0a1628" fill-opacity="0.8"/>
  <!-- Salesforce embed label -->
  <text x="776" y="638" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#6a8fa8">
    Embedded in Salesforce Account Record via Lightning Web Component
  </text>
  <rect x="1244" y="620" width="168" height="26" rx="13" fill="#29b5e8" fill-opacity="0.18" stroke="#29b5e8" stroke-width="1" stroke-opacity="0.3"/>
  <text x="1328" y="637" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600"
        fill="#29b5e8" text-anchor="middle">SPCS · Port 8002</text>

  <!-- ─────────────────────────────────────────── -->
  <!-- Decorative: connection lines               -->
  <!-- ─────────────────────────────────────────── -->

  <!-- Vertical separator line between panels -->
  <line x1="720" y1="140" x2="720" y2="610" stroke="#29b5e8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6,6"/>

  <!-- Corner accent top-left -->
  <rect x="0" y="0" width="8" height="750" fill="url(#aiGrad)"/>

  <!-- Bottom strip -->
  <rect x="0" y="720" width="1500" height="30" fill="#000000" fill-opacity="0.3"/>
  <text x="750" y="740" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#4a6a80"
        text-anchor="middle" letter-spacing="1">
    Built with Snowflake Cortex AI · FastAPI · React · Salesforce Lightning
  </text>
</svg>
